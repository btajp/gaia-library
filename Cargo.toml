[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/btajp/gaia-library"

[workspace.dependencies]
gaia-core = { path = "crates/gaia-core" }
gaia-mcp = { path = "crates/gaia-mcp" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
http = "1"
jsonschema = { version = "0.51", default-features = false }
rand = "0.9"
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "time"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# build-dependencies（gaia-core の build.rs）
typify = "0.7"
schemars = "0.8.22"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }
